# Run Tests on Pull Request
#
# Triggers on pull requests to main branch
# Runs linting, formatting, and type checking

name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run TypeScript check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run ESLint
        working-directory: backend
        run: npm run lint

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  format-check:
    name: Check Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Prettier
        run: npm ci

      - name: Check formatting
        run: npx prettier --check "backend/src/**/*.ts" "frontend/src/**/*.{ts,tsx}"

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, format-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        working-directory: backend
        run: docker build -t garment-erp-backend:test .

      - name: Build frontend image
        working-directory: frontend
        run: docker build -t garment-erp-frontend:test --build-arg VITE_API_URL=http://localhost:5000/api .

      - name: Images built successfully
        run: echo "Docker images built successfully!"
